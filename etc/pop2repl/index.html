<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8"/>
	<meta property='og:type' content='website'/>
	<meta property='og:site_name' content="Uxn Interpreter"/>
	<meta property="og:title" content="POP-2 Playground"/>
	<meta property='og:description' content="By Devine Lu Linvega"/>
	<meta property='og:logo' content="https://wiki.xxiivv.com/media/services/pop2_icon.png"/>
	<meta property='og:image' content="https://wiki.xxiivv.com/media/services/pop2_logo.png"/>
	<meta property="og:url" content="https://wiki.xxiivv.com/site/pop2.html"/>
	<meta name="viewport" content="width=device-width" />
	<link href="../../media/services/pop2_icon.png" type="image/png" rel="shortcut icon">
	<title>POP-2 Playground</title>
	<script src="../uxnrepl/src/uxn.js"></script>
	<script src="../uxnrepl/src/emu.js"></script>
	<script src="../uxnrepl/src/asm.js"></script>
	<script src="src/pop2.js"></script>
	<script src="src/examples.js"></script>
</head>
<body>
	<textarea id="editor" spellcheck="false"></textarea>
	<div id='logs'>Press <b>Compile</b> to evaluate.</div>
	<div id='menu'>
		<input type="button" id="run" value="Loading..">
		<span id='result'><a href='../../site/pop2.html' target='_blank'>Read Manual</a></span>
		<select id="examples"></select>
		<input type="button" id="tal" class="option" value="Tal">
	</div>
	<script type="text/javascript">
const repl = new Repl(pop2, "Compile").init()

const logs_el = document.getElementById("logs")
const editor_el = document.getElementById("editor")
const result_el = document.getElementById("result")

let source = "( Press compile first )"

document.getElementById("tal").addEventListener("click", () => {
	repl.popup(source)
})

repl.postrun = (stdout, stderr) => {
	// Compile resulting Uxntal
	source = stdout
	let program = new Uint8Array(0x10000)
	let res = assemble(stdout, program)
	if(!res) {
		result_el.innerHTML = "Compilation failed."
		return
	}
	// Eval result
	let emu_pop = new Emu()
	emu_pop.uxn.load(program).init()
	emu_pop.uxn.eval(0x100)
	logs_el.innerHTML += emu_pop.console.stdout_body
	result_el.innerHTML = emu_pop.system.print_wst()
}

function assemble(query, program) {
	let emu_asm = new Emu()
	let rom_length = 0
	emu_asm.console.write = (char) => { program[rom_length++] = char }
	emu_asm.uxn.load(assembler).eval(0x0100)
	logs_el.innerHTML = ""
	for (let i = 0; i < query.length; i++)
		emu_asm.console.input(query.charAt(i).charCodeAt(0), 1)
	emu_asm.console.input(0x0a, 2)
	emu_asm.console.input(0x00, 4)
	result_el.innerHTML = `> ${emu_asm.console.stdout_body}`
	logs_el.innerHTML = emu_asm.console.stderr_body.replaceAll("Î»","λ")
	logs_el.scrollTop = logs_el.scrollHeight;
	return rom_length
}

	</script>
	<style>
		body { font-family:monospace; overflow:hidden; height:100vh; padding:0; margin:0 }
		body a { color: black }
		body ::selection { text-decoration:none; background:#000;color:#fff }
		noscript { width: 100%; height:100% }
		textarea { resize:none; width:calc(100vw - 20px); height:100vh; border:0; padding:10px; margin:0px; tab-size: 2 }
		textarea:focus { outline: none !important }
		div#logs { padding:10px; color:black; height:85px; overflow-x:hidden; overflow-y:scroll; white-space:pre; display:none }
		div#menu { height:25px; padding:10px; margin-bottom:20px;font-weight:bold; display:none }
		div#menu select { float:right }
		div#menu a { text-decoration: none; font-weight:normal }
		div#menu a:hover { text-decoration: underline }
		div#menu .option { float:right; margin-right:5px; cursor:pointer }
		body.active textarea { height:calc(100% - 170px) }
		body.active #logs, body.active #menu, body.active #editor { display:block !important }
		#run { cursor:pointer; border:0px; border-radius:100px; line-height:24px; padding:0px 10px; font-size:12px }
		/* Overrides */
		body ::selection { background:#cbff59;color:#000 }
		textarea { background:#e8e8e8; color:#000 }
		div#logs { background:#f0f0f0; color:#000 }
		div#menu { background:#f8f8f8; color:#fff }
		div#menu a, div#menu #result { color:#000 }
		#run { background:#000; color:#fff }
		#run:hover { background: #fff; color:#000 }
	</style>
</body>
</html>
